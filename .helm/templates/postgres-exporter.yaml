apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
      - name: postgres-exporter
        image: wrouesnel/postgres_exporter
        ports:
        - containerPort: 9187
        env:
        - name: user_test_db 
          value: "postgresql://service:password@postgres-database-postgresql:5432/user_test_db?sslmode=disable"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
spec:
  type: NodePort
  ports:
  - port: 9187
    targetPort: 9187
    nodePort: 30087
  selector:
    app: postgres-exporter